name: Fetch external model assets

on:
  push:
    paths:
      - ".github/workflows/fetch_external_model_assets_20261002.yml"
  workflow_dispatch:

jobs:
  eomt-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download EoMT-DINOv3 checkpoint
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p payload/eomt payload/wheels payload/chunks
          python -m pip install --quiet --disable-pip-version-check "huggingface_hub[hf_xet]"
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="tue-mps/eomt-dinov3-coco-instance-large-640",
              local_dir="payload/eomt",
              allow_patterns=["config.json", "preprocessor_config.json", "model.safetensors"],
          )
          PY

      - name: Build offline Transformers wheel bundle
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip download --dest payload/wheels "transformers==5.17.0"
          tar -C payload/wheels -czf payload/transformers-wheels-py312-linux.tar.gz .

      - name: Package and split transfer archive
        shell: bash
        run: |
          set -euxo pipefail
          tar -C payload -czf payload/eomt-assets.tar.gz eomt transformers-wheels-py312-linux.tar.gz
          sha256sum payload/eomt-assets.tar.gz | awk '{print $1}' > payload/eomt-assets.sha256
          stat -c '%s' payload/eomt-assets.tar.gz > payload/eomt-assets.bytes
          split -b 16M -d -a 4 payload/eomt-assets.tar.gz payload/chunks/eomt-assets.part-
          ls -lh payload/eomt-assets.tar.gz payload/chunks | head -20

      - name: Push chunked EoMT assets to workstation
        shell: bash
        run: |
          set -euxo pipefail
          base="https://sunjunhao-pc.tail42134c.ts.net:10001/upload/4c8e7f1a3d9b52e68f0c71aa"
          push_file () {
            file="$1"
            name="$2"
            curl --fail-with-body --retry 6 --retry-all-errors --retry-delay 1 \
              -H "Expect:" \
              -H "X-Filename: $name" \
              --upload-file "$file" \
              "$base"
          }
          push_file payload/eomt-assets.sha256 eomt-assets.sha256
          push_file payload/eomt-assets.bytes eomt-assets.bytes
          for part in payload/chunks/eomt-assets.part-*; do
            push_file "$part" "$(basename "$part")"
          done
