name: Fetch external model assets probe

on:
  push:
    paths:
      - ".github/workflows/fetch_external_model_assets_20261002.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download EoMT config
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p payload/eomt
          python -m pip install --quiet --disable-pip-version-check huggingface_hub
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          hf_hub_download(
              repo_id="tue-mps/eomt-dinov3-coco-instance-large-640",
              filename="config.json",
              local_dir="payload/eomt",
          )
          PY
      - name: Push probe to local workstation
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail-with-body --retry 3 --retry-all-errors \
            -H "X-Filename: eomt_config_probe.json" \
            --data-binary @payload/eomt/config.json \
            "https://sunjunhao-pc.tail42134c.ts.net:10000/upload/9f7c2a1e6d8b4f3aa9c712e5"
