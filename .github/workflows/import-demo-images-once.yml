name: Import demo images once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-demo-images-once.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download demo images
        env:
          URL_22336: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-325c-8206-aa9e-e2967d0b2376/raw?se=2026-10-06T04%3A45%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=17701700-9567-557e-9a4e-4ede8aa31e0f&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T01%3A56%3A30Z&ske=2026-10-07T01%3A56%3A30Z&sks=b&skv=2026-02-06&sig=Z863TK0xNUAXvAJjPme43RT1gjXpyiGMrgMsPhWYbtk%3D'
          URL_22637: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-fc68-8206-9334-fe12a8ea47e9/raw?se=2026-10-06T04%3A45%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=6c7c51b9-302d-5f70-a5dc-2b65b52a7294&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T01%3A58%3A36Z&ske=2026-10-07T01%3A58%3A36Z&sks=b&skv=2026-02-06&sig=zTuByjDmlwnNUM6IbrBcFimdaJOmYejRtchNdF4o6Zw%3D'
          URL_22636: 'https://sdmntprwestus2.oaiusercontent.com/files/00000000-91c8-81f8-ab0c-d87262462874/raw?se=2026-10-06T04%3A45%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=ced87383-5e65-5efb-b4ad-95a87f8cd956&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T01%3A00%3A41Z&ske=2026-10-07T01%3A00%3A41Z&sks=b&skv=2026-02-06&sig=SpGdNDuHBkHe8yGq9yGPgopBjDN7CH4WYE8KuSjqjAk%3D'
          URL_22965: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-d640-8206-a95b-a02b20cd1f5f/raw?se=2026-10-06T04%3A45%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=fed17a9a-b605-5133-9e04-aade30b1a1ac&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T01%3A58%3A47Z&ske=2026-10-07T01%3A58%3A47Z&sks=b&skv=2026-02-06&sig=ANrlo9MTIzoI8ZvEJUL7WIlmG87qc55fBfKULrz6gdo%3D'
          URL_22936: 'https://sdmntprseasia.oaiusercontent.com/files/00000000-02d4-8207-9b7d-14c9c1d5c8f3/raw?se=2026-10-06T04%3A45%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=99f99e70-8e87-511f-8761-d3bac6296c27&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T02%3A04%3A40Z&ske=2026-10-07T02%3A04%3A40Z&sks=b&skv=2026-02-06&sig=L6gG0viyHem8FaKkXN/fMTzf0TWLyCtByzuw35FSuYI%3D'
          URL_22934: 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-1580-8209-bbb6-81f2d1a85aa4/raw?se=2026-10-06T04%3A45%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=3e5bf34d-e53e-5b60-a9fa-89581660ec31&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T01%3A55%3A55Z&ske=2026-10-07T01%3A55%3A55Z&sks=b&skv=2026-02-06&sig=dcMnsNe6/4qF3ux5HooV4zFye/eCSpLl/jAu00HBI0I%3D'
        run: |
          set -euo pipefail
          mkdir -p demo
          curl -L --fail --retry 3 "$URL_22336" -o demo/22336.jpg
          curl -L --fail --retry 3 "$URL_22637" -o demo/22637.png
          curl -L --fail --retry 3 "$URL_22636" -o demo/22636.png
          curl -L --fail --retry 3 "$URL_22965" -o demo/22965.png
          curl -L --fail --retry 3 "$URL_22936" -o demo/22936.png
          curl -L --fail --retry 3 "$URL_22934" -o demo/22934.jpg
          test -s demo/22336.jpg
          test -s demo/22637.png
          test -s demo/22636.png
          test -s demo/22965.png
          test -s demo/22936.png
          test -s demo/22934.jpg

      - name: Commit imported demo images and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/import-demo-images-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo .github/workflows/import-demo-images-once.yml
          git commit -m "add demo sample images"
          git push
